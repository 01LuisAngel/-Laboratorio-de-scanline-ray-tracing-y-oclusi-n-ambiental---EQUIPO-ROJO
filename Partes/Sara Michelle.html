<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Integrante 3: oclusión ambiental</title>
  <style>
    body { background:#0E1220; color:#A8B896; font-family:sans-serif; margin:20px; }
    select, input, button { background:#1c2a30; color:#A8B896; border:1px solid #5E8A8A; padding:6px 10px; margin-right:6px; }
    button { cursor:pointer; background:#3E5A5A; }
    canvas { display:block; margin:16px 0; border:2px solid #3E5A5A; background:#0E1220; }
    table { border-collapse:collapse; }
    th, td { border:1px solid #3E5A5A; padding:6px 14px; text-align:left; }
    th { background:#1c2a30; }
    .nota { color:#8aa; font-size:13px; max-width:720px; }
  </style>
</head>
<body>
  <h2>Integrante 3: oclusión ambiental</h2>
  <p class="nota">Tu parte es ao.js. scene.js (líder) y raytracing.js (integrante 2, de donde sale intersect) se incluyen solo para poder probar. Ajusta las muestras para ver el ruido.</p>

  <label>Técnica:
    <select id="tecnica">
      <option value="ao">Oclusión ambiental</option>
    </select>
  </label>
  <label>Resolución:
    <select id="res">
      <option value="200">200×200</option>
      <option value="400" selected>400×400</option>
      <option value="600">600×600</option>
    </select>
  </label>
  <label>Muestras AO:
    <input id="samples" type="number" value="16" min="1" max="128" style="width:70px">
  </label>
  <button id="go">Renderizar</button>

  <canvas id="c" width="400" height="400"></canvas>

  <table id="tabla">
    <thead><tr><th>Técnica</th><th>Resolución</th><th>Tiempo (ms)</th></tr></thead>
    <tbody></tbody>
  </table>

  <script>
/* ============================================================
   DEPENDENCIA de Integrante 1 (solo para poder probar; NO lo subas en tu rama)
   ============================================================ */
// --- scene.js ---
// scene.js  (INTEGRANTE 1 - líder)
// Escena base + helpers matemáticos compartidos por todas las técnicas.
// Paleta: salvia, verde azulado, gris verdoso, azul casi negro.

const SCENE = {
  camera: { pos: [0, 1, -4], fov: 60 },
  light:  { pos: [5, 8, -3] },
  spheres: [
    { c: [0, 1, 0],       r: 1,   color: [168, 184, 150] },   // salvia
    { c: [2.2, 0.6, 1],   r: 0.6, color: [94, 138, 138]  },   // verde azulado
    { c: [-2, 0.5, 0.5],  r: 0.5, color: [232, 192, 32]  },   // acento amarillo
  ],
  plane: { y: 0, color: [62, 90, 90] },
  bg: [14, 18, 32],
};

// Cada técnica se registra aquí: RENDERERS.nombre = function (ctx, W, H, opts) {...}
const RENDERERS = {};

// ---- Helpers compartidos (NO volver a declararlos en otros archivos) ----
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [
  a[1] * b[2] - a[2] * b[1],
  a[2] * b[0] - a[0] * b[2],
  a[0] * b[1] - a[1] * b[0],
];
const normalize = a => { const l = Math.hypot(a[0], a[1], a[2]); return [a[0] / l, a[1] / l, a[2] / l]; };
  </script>

  <script>
/* ============================================================
   DEPENDENCIA de Integrante 2 (solo para poder probar; NO lo subas en tu rama)
   ============================================================ */
// --- raytracing.js ---
// raytracing.js  (INTEGRANTE 2)
// Rayos primarios, intersección con esferas y plano, sombras y un reflejo.

RENDERERS.raytracing = function (ctx, W, H) {
  const img = ctx.createImageData(W, H);
  const f = Math.tan((SCENE.camera.fov * Math.PI / 180) / 2);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const dir = normalize([(2 * (x + 0.5) / W - 1) * f, (1 - 2 * (y + 0.5) / H) * f, 1]);
    const c = trace(SCENE.camera.pos, dir, 1);
    img.data.set([c[0], c[1], c[2], 255], (y * W + x) * 4);
  }
  ctx.putImageData(img, 0, 0);
};

// Devuelve el impacto más cercano {t, p, n, color, refl} o null
function intersect(o, d) {
  let best = null, tBest = Infinity;

  for (const s of SCENE.spheres) {
    const oc = sub(o, s.c);
    const b = dot(oc, d);
    const c = dot(oc, oc) - s.r * s.r;
    const disc = b * b - c;
    if (disc > 0) {
      const t = -b - Math.sqrt(disc);
      if (t > 1e-3 && t < tBest) {
        const p = add(o, mul(d, t));
        tBest = t;
        best = { t, p, n: normalize(sub(p, s.c)), color: s.color, refl: 0.3 };
      }
    }
  }

  if (Math.abs(d[1]) > 1e-6) { // plano horizontal
    const t = (SCENE.plane.y - o[1]) / d[1];
    if (t > 1e-3 && t < tBest) {
      tBest = t;
      best = { t, p: add(o, mul(d, t)), n: [0, 1, 0], color: SCENE.plane.color, refl: 0.2 };
    }
  }
  return best;
}

function trace(o, d, depth) {
  const h = intersect(o, d);
  if (!h) return SCENE.bg;

  const toL = normalize(sub(SCENE.light.pos, h.p));
  const shadow = intersect(add(h.p, mul(h.n, 1e-3)), toL); // rayo de sombra
  const diff = shadow ? 0.15 : Math.max(0.15, dot(h.n, toL));
  let col = h.color.map(c => c * diff);

  if (depth > 0) { // reflejo
    const r = sub(d, mul(h.n, 2 * dot(d, h.n)));
    const rc = trace(add(h.p, mul(h.n, 1e-3)), r, depth - 1);
    col = col.map((c, i) => c * (1 - h.refl) + rc[i] * h.refl);
  }
  return col;
}
  </script>

  <script>
/* ============================================================
   ESTA ES TU PARTE (Integrante 3)
   ============================================================ */
// --- ao.js ---
// ao.js  (INTEGRANTE 3)
// Oclusión ambiental: se lanzan N rayos en el hemisferio de cada punto.
// El color se multiplica por la fracción de rayos que NO chocan cerca.

const AO_RADIUS = 1.5; // distancia máxima a la que algo cuenta como oclusión

RENDERERS.ao = function (ctx, W, H, opts) {
  const N = (opts && opts.samples) || 16;
  const img = ctx.createImageData(W, H);
  const f = Math.tan((SCENE.camera.fov * Math.PI / 180) / 2);

  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const dir = normalize([(2 * (x + 0.5) / W - 1) * f, (1 - 2 * (y + 0.5) / H) * f, 1]);
    const h = intersect(SCENE.camera.pos, dir);
    let col = SCENE.bg;

    if (h) {
      const origin = add(h.p, mul(h.n, 1e-3));
      let libres = 0;
      for (let i = 0; i < N; i++) {
        const hit = intersect(origin, randomHemisphere(h.n));
        if (!hit || hit.t > AO_RADIUS) libres++;
      }
      const ao = libres / N;
      col = h.color.map(c => c * ao);
    }
    img.data.set([col[0], col[1], col[2], 255], (y * W + x) * 4);
  }
  ctx.putImageData(img, 0, 0);
};

// Dirección aleatoria en el hemisferio alrededor de la normal n
function randomHemisphere(n) {
  while (true) {
    const v = [Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1];
    const l2 = dot(v, v);
    if (l2 <= 1 && l2 > 1e-4) {
      const u = normalize(v);
      return dot(u, n) < 0 ? mul(u, -1) : u;
    }
  }
}
  </script>

  <script>
/* ============================================================
   RUNNER DE PRUEBA (no es parte de tu entrega)
   ============================================================ */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
document.getElementById('go').onclick = () => {
  const tec = document.getElementById('tecnica').value;
  const res = parseInt(document.getElementById('res').value, 10);
  const samples = parseInt(document.getElementById('samples').value, 10);
  canvas.width = canvas.height = res;
  const t0 = performance.now();
  RENDERERS[tec](ctx, res, res, { samples, aa: 2 });
  const ms = (performance.now() - t0).toFixed(1);
  const fila = document.createElement('tr');
  fila.innerHTML = '<td>' + tec + '</td><td>' + res + '×' + res + '</td><td>' + ms + '</td>';
  document.querySelector('#tabla tbody').appendChild(fila);
};
  </script>
</body>
</html>
